name: quote-probe
on:
  push:
    branches: [claude/project-thread-j1yu9d]
    paths: [.github/workflows/quote-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yahoo chart feed
        run: |
          for s in SPY NVDA AMAT; do
            curl -s -o /tmp/q.json -w "$s http=%{http_code} " -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/$s?range=1d&interval=5m"
            python3 -c "import json;m=json.load(open('/tmp/q.json'))['chart']['result'][0]['meta'];print(m['regularMarketPrice'],m.get('regularMarketTime'))" || head -c 200 /tmp/q.json
          done

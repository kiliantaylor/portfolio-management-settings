name: live
# Price Targets live refresh without a Claude session: fills, live quotes, review at live prices, page patch.
# Inputs: branch live-data (live/slice.py, pushed by the nightly run) and the fills tab of the Price Targets live Sheet.
# Outputs: the Sheet's live tab (read by the page), fills/ on main (folded into trades.json nightly), branch live-out.
on:
  # Started every 30 minutes by a time trigger in the Price Targets live Sheet (Apps Script, live/apps_script.gs): while the
  # New York market is open, and outside it only when a new fill is waiting. GitHub's own schedule skipped most runs here.
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the patch even when the market is closed and no fill changed
        type: boolean
        default: false
concurrency:
  group: live
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  gate:  # one cheap step: is the market open, or is a fill on the Sheet waiting?
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: live
      - run: pip install -q google-auth requests
      - id: gate
        env:
          SHEET_ID: 1eSjig2l4LWcO7YNdXprVNZKend-53uyM8-6PS4aw-0U
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          FORCE: ${{ inputs.force }}
        run: python3 live/gate.py >> "$GITHUB_OUTPUT"
  live:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - name: Check out live-data and live-out
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone -q --depth 1 -b live-data "$URL" slice
          git clone -q --depth 1 -b live-out "$URL" out || mkdir -p out
          sudo mkdir -p /mnt && sudo ln -sfn "$GITHUB_WORKSPACE/slice" /mnt/project-files
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -q google-auth requests
      - name: Refresh
        env:
          SHEET_ID: 1eSjig2l4LWcO7YNdXprVNZKend-53uyM8-6PS4aw-0U
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python3 main/live/run.py /mnt/project-files main/fills out ${{ inputs.force && '--force' || '' }}
      - name: Commit new fills
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          cd main
          git add -A fills
          git diff --cached --quiet && exit 0
          git -c user.name=live-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Fills from the Price Targets page"
          git pull -q --rebase "$URL" "$GITHUB_REF_NAME" && git push -q "$URL" "HEAD:$GITHUB_REF_NAME"
      - name: Publish patch
        env:
          URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          cd out
          [ -f .updated ] || exit 0
          rm .updated
          rm -rf .git && git init -q && git checkout -q -b live-out && git add patch.json state.json && { [ -d remark ] && git add remark || true; }
          git -c user.name=live-bot -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "live $(date -u +%FT%TZ)"
          git push -qf "$URL" live-out
